<section class="container make-transfer ff-inter">
    <header class="header">
        <h2>Faça uma nova transferência:</h2>
    </header>
    <form #transferForm="ngForm">
        <label for="dest">Conta destino</label>
        <input type="text"
         id="dest"
         name="dest"
         class="input"
         placeholder="Digite o número da conta"
         required
         [value]="transfer.destinationAccount"
         (ngModelChange)="onContaInput($event)"
         autocomplete="off"
         [(ngModel)]="transfer.destinationAccount">

         <ul *ngIf="contasFiltradas.length > 0" class="suggestions">
            <li
              *ngFor="let fav of contasFiltradas"
              (click)="usarConta(fav.contaDestino)"
              style="cursor: pointer; padding: 4px 0;"
            >
              {{ fav.nomeFavorito }} ({{ fav.contaDestino }})
            </li>
          </ul>
            
        <button
            *ngIf="mostrarBotaoFavoritar"
            type="button"
            class="botaoFavoritar"
            (click)="favoritarConta()"
            >
            Salvar conta como favorita
        </button>
                <label for="valor">Valor</label>
        <input type="text"
         id="valor"
         name="valor"
         class="input"
         placeholder="R$ 100,00"
         required
         (blur)="onAmountInput($event)"
         [(ngModel)]="formattedAmount"
         (input)="validateNumberInput($event)">

         <label for="autoria">Data da Transferência</label>
         <input type="date"
          id="diaa"
          name="diaa"
          class="input"
          [min]="minDate"
          required
          [(ngModel)]="transfer.transferDate"/>
        <div class="acoes">
            <button (click)="create()"
             [ngClass]="{'botao': transferForm.valid, 'botaoInvalido': transferForm.invalid}"
             [disabled]="transferForm.invalid">Salvar</button>
            <button (click)="cancel()" class="botao">Cancelar</button>
        </div>
    </form>
</section>
